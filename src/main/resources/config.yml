# ========================================================
# Конфигурация плагина TownyArchitecture
# Совместимо с Paper 1.20+, Towny 0.98+, mcMMO 2.1+
# ========================================================

settings:
  # Требовать ли наличие уровня mcMMO для строительства
  enforce-mcmmo-level: true
  
  # Название навыка mcMMO, проверяемого для чертежей (по умолчанию BUILDING)
  mcmmo-skill-name: "BUILDING"
  
  # Количество опыта mcMMO за каждый поставленный блок чертежа
  mcmmo-xp-per-block: 15
  
  # Порог прочности (в %), ниже которого баффы здания временно отключаются
  buff-suspension-health-percent: 70.0
  
  # Интервал (в секундах) проверки и наложения пассивных эффектов
  buff-check-interval-seconds: 5
  
  # Правила распределения баффов (СТРОГО для жителей города):
  # - 1x1 чанк: радиус 5 чанков вокруг постройки
  # - 2x1 / 1x2 чанка: вся территория города Towny
  # - 2x2 чанка (Чудеса Света): везде на всей карте (во всех мирах)
  buff-1x1-chunk-radius: 5
  
  # Визуальные и звуковые эффекты
  particles-enabled: true
  sound-effects-enabled: true

messages:
  prefix: "&6[TownyBuilds]&r "
  no-permission: "&cУ вас нет прав на использование этой команды!"
  not-in-town: "&cВы должны состоять в городе для использования этой функции!"
  not-mayor-or-builder: "&cТолько мэр или назначенный строитель могут строить на участках постройки!"
  outside-town-bounds: "&cВыделенная территория выходит за пределы границ вашего города!"
  mcmmo-level-too-low: "&cВаш уровень mcMMO (%level%) ниже требуемого (%required%)!"
  wonder-already-built: "&4[!] Это Чудо Света уже воздвигнуто городом %town% и заблокировано навсегда!"
  project-started: "&aПроект «&e%name%&a» утвержден на чанках &f%chunks%&a! Размещайте необходимые блоки."
  building-completed: "&6&l[ГОРОД]&a Строительство «&e%name%&a» завершено на 100%%! Баффы активированы!"
  building-damaged: "&c&l[ОСАДА]&e Здание «&6%name%&e» повреждено (%health%%)! Баффы отключены до починки!"
  building-repaired: "&aЗдание «&e%name%&a» восстановлено до 100%%! Баффы снова действуют."
